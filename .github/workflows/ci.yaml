name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cloud-app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 하네스 검증
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: cloud-app
          DB_USER: root
          DB_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: ./scripts/verify.sh
