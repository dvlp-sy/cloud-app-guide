<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 | Cloud Application Guide</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/items/list.css}">
    <link rel="stylesheet" th:href="@{/css/items/detail.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <p class="muted">
        <a th:href="@{/items}">상품 목록</a> / 상품 상세
    </p>

    <section class="panel detail-layout">
        <div class="placeholder-image">ITEM</div>

        <div>
            <h1 class="page-title" th:text="${item.name}">상품명</h1>

            <p class="page-description" th:text="${item.description}">
                상품 설명
            </p>

            <p class="price">
            <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}">
                59,000
            </span>원
            </p>

            <div class="info-row">
                <span class="muted">상품 번호</span>
                <span id="itemId" th:text="${item.itemId}">1</span>
            </div>

            <div class="info-row">
                <span class="muted">재고</span>
                <span id="itemStock" th:text="${item.quantity}">25</span>개
            </div>

            <div class="info-row">
                <label for="quantity" class="muted">주문 수량</label>
                <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        value="1"
                        min="1"
                        th:attr="max=${item.quantity}"
                        required
                >
            </div>

            <div class="info-row">
                <span class="muted">총 주문 금액</span>
                <strong id="totalPrice"
                        th:attr="data-price=${item.price}"
                        th:text="|${#numbers.formatInteger(item.price, 0, 'COMMA')}원|">
                    59,000원
                </strong>
            </div>

            <p id="errorMessage" class="error-message" hidden></p>

            <div class="button-group">
                <button type="button" class="button" id="orderButton">
                    주문하기
                </button>

                <a class="button button-secondary" th:href="@{/items}">
                    목록으로
                </a>
            </div>
        </div>
    </section>

    <script th:src="@{/js/items/order.js}" defer></script>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
