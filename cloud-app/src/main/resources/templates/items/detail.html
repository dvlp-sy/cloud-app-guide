<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 | Cloud Commerce Lab</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container">
    <p class="muted">
        <a th:href="@{/items}">상품 목록</a> / 상품 상세
    </p>

    <section class="panel detail-layout">
        <div class="placeholder-image">ITEM</div>

        <div>
            <h1 class="page-title" th:text="${item.name}">상품명</h1>

            <p class="page-description" th:text="${item.description}">
                상품 설명
            </p>

            <p class="price">
                <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}">
                    59,000
                </span>원
            </p>

            <div class="info-row">
                <span class="muted">상품 번호</span>
                <span th:text="${item.id}">1</span>
            </div>

            <div class="info-row">
                <span class="muted">재고</span>
                <span th:text="${item.stock} + '개'">25개</span>
            </div>

            <div class="button-group">
                <button type="button" class="button" id="orderButton">
                    주문하기
                </button>

                <a class="button button-secondary"
                   th:href="@{/items}">
                    목록으로
                </a>
            </div>

            <!--
            TODO: REST API 연동
            1. POST /api/v1/orders 호출
            2. 주문 성공 시 반환된 orderId 확인
            3. /orders/{orderId}로 이동
            -->

            <!--
            <script>
                document.getElementById('orderButton').addEventListener('click', async () => {
                    // TODO: 로그인한 회원 ID와 상품 ID를 이용해 주문 API 호출
                    // const response = await fetch('/api/v1/orders', { ... });
                    // const order = await response.json();
                    // location.href = `/orders/${order.id}`;
                });
            </script>
            -->
        </div>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
