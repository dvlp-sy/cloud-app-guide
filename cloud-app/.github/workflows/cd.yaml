name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  package:
    name: 릴리스 검증 및 패키징
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cloud-app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 버전 태그 확인
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "유효하지 않은 Semantic Versioning 태그: $RELEASE_VERSION"
            exit 1
          fi
          echo "릴리스 버전: $RELEASE_VERSION"

      - name: 테스트 및 JAR 패키징
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: cloud-app
          DB_USER: root
          DB_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: ./gradlew test bootJar --console=plain

      - name: JAR 산출물 보관
        uses: actions/upload-artifact@v4
        with:
          name: cloud-app-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error
